name = "simple-block-builder"
compatibility_date = "2026-05-01"
pages_build_output_dir = "."

[[d1_databases]]
binding       = "DB"
database_name = "simple-block-builder"
database_id   = "3b91f996-d02d-45b1-8f21-820f2e97bd19"

# Almacenamiento de imágenes subidas por el usuario (Biblioteca → "Subir imágenes").
# El código usa el binding IMAGENES (functions/api/upload.js).
[[r2_buckets]]
binding     = "IMAGENES"
bucket_name = "zurich-chile"

# Variables NO sensibles. Se administran aquí (no en el dashboard).
# ACCESOS: los usuarios (nombre + contraseña + permisos) viven en usuarios.js
# en la raíz del repo — se editan ahí y con git push quedan activos.
[vars]
SITE_URL          = "https://simple-block-builder.gamonal.app"
SUPER_ADMIN_EMAIL = "hola@andresgamonal.com"
RESEND_FROM       = "Simple Block Builder <onboarding@resend.dev>"

# Las variables sensibles (cifradas) se configuran como Secrets en
# Cloudflare Pages → Settings → Variables y secretos:
#   - JWT_SECRET      (firma la cookie de sesión)
#   - RESEND_KEY      (API key de Resend para enviar correos)
#   - GEMINI_API_KEY  (API key de Google AI Studio para "Generar con IA")
# Opcional (variable normal): GEMINI_MODEL (por defecto: gemini-2.5-flash)
#
# Para desarrollo local, defínelas en .dev.vars (ver .dev.vars.example).

# ═══════════════════════════════════════════════════════════════════════
# BORRADOR (preview) — datos SEPARADOS de producción
#
# Todo lo de arriba es PRODUCCIÓN (simple-block-builder.gamonal.app) y no
# se toca. Esta sección solo aplica a los deployments de PREVIEW, que es lo
# que Cloudflare Pages genera para cualquier rama distinta de main.
#
# Sin esto, el borrador escribiría en la MISMA base y el MISMO bucket que
# producción: probar una mejora en la rama podía sobrescribir el espacio de
# trabajo real (el guardado sincroniza el workspace completo, gana el último
# que escribe). Con esta sección, el borrador tiene su propia base y su
# propio bucket, y nada de lo que se pruebe ahí llega a producción.
#
# Los bindings NO se heredan del nivel raíz: hay que repetirlos completos.
# ═══════════════════════════════════════════════════════════════════════
[env.preview]

[[env.preview.d1_databases]]
binding       = "DB"
database_name = "simple-block-builder-draft"
database_id   = "b3aed47b-8766-410a-98f2-176175ca6a47"

[[env.preview.r2_buckets]]
binding     = "IMAGENES"
bucket_name = "zurich-chile-draft"

[env.preview.vars]
SITE_URL          = "https://sbb-draft-mejoras.simple-block-builder.pages.dev"
SUPER_ADMIN_EMAIL = "hola@andresgamonal.com"
RESEND_FROM       = "Simple Block Builder <onboarding@resend.dev>"
