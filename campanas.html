<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campañas · My Ads</title>
<link rel="icon" href="/brand/my-ads.svg?v=4" type="image/svg+xml">
<link rel="alternate icon" href="/brand/icono_my_ads.ico?v=4" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet">
<!--
  CAMPAÑAS DE SEARCH — la campaña con forma de Google Ads Editor (paso 4b, mockup aprobado 27-sep-2026:
  mockups/campana-conversacion.html). Tres pantallas:
    [1] /campanas/nueva   el encargo → la IA investiga y arma la campaña completa (modo:'campana')
    [2] /campanas/<id>    trabajarla: árbol · detalle editable · Revisión (motor de reglas) ·
                          Conversación (corregir / averiguar POR PARTES) · Ficha
    [3] exportar          CSV para Ads Editor: completo o solo cambios desde la versión publicada
  La lista (/campanas) es la entrada. Todo lo que decide vive en el núcleo (nucleo/*.js), el MISMO que
  usa el servidor: aquí solo se muestra y se llama. Cada guardado es una versión (/api/iniciativas).
-->
<style>
:root{
  --navy:#040764;--navy-d:#02034a;--navy-l:#eef1fb;--blue:#1c73cb;--blue-l:#e7f0fb;--yellow:#fce865;
  --magenta:#b318a3;--magenta-l:#f7e6f4;--teal:#20b6b6;--teal-l:#e4f6f6;
  --ink:#12173d;--ink2:#3a4060;--ink3:#5b6178;--ink4:#8a90a5;
  --bg:#eef1f6;--white:#fff;--bdr:#e4e8f0;--bdr2:#c2c7d4;--ok:#1c973b;--ok-l:#e6f6ec;--warn:#b86e00;--warn-l:#fff4e0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Roboto,Arial,sans-serif;font-weight:400;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.45}
button{font:inherit;cursor:pointer}
a{color:var(--blue);text-decoration:none}
*::-webkit-scrollbar{width:8px;height:8px}*::-webkit-scrollbar-thumb{background:#cdd2de;border-radius:8px}

/* [0] CABECERA */
.ed{height:56px;background:#fff;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:5}
.marca-app{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:500}
.logo{width:28px;height:28px;background:var(--navy);border-radius:7px;position:relative;flex:none}
.logo:after{content:"";position:absolute;left:6px;right:6px;top:7px;height:4px;background:var(--yellow);border-radius:1px}
.logo:before{content:"";position:absolute;left:6px;width:7px;bottom:6px;height:8px;background:#1C73CB;border-radius:1px;box-shadow:9px 0 0 #20B6B6}
.crumb{font-size:14px;color:var(--ink3)}.crumb b{color:var(--ink);font-weight:500}.crumb a{color:var(--ink3)}
.chip{font-size:11px;font-weight:500;letter-spacing:.04em;padding:3px 8px;border-radius:5px;background:#e9eaf0;color:var(--ink2)}
.sp{flex:1}
.estados{display:flex;align-items:center;font-size:12px}
.estados span{padding:5px 10px;border:1px solid var(--bdr);color:var(--ink3);background:#fff}
.estados span:first-child{border-radius:6px 0 0 6px}.estados span:last-child{border-radius:0 6px 6px 0}
.estados span+span{border-left:0}
.estados .hecho{color:var(--ok);background:var(--ok-l)}
.estados .aqui{color:#fff;background:var(--navy);border-color:var(--navy);font-weight:500}
.ver{font-size:12px;color:var(--ink3);white-space:nowrap}
.btn{border:1px solid var(--bdr2);background:#fff;color:var(--ink);border-radius:8px;padding:8px 14px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.pri:hover{background:var(--navy-d)}
.btn.ia{background:var(--magenta);border-color:var(--magenta);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.link{border:0;background:none;color:var(--blue);padding:4px 0}
.btn[disabled]{opacity:.5;cursor:default}

/* [1] LISTA Y CREAR */
.pag{max-width:980px;margin:24px auto;padding:0 16px}
.pag h1{font-size:22px;font-weight:500}
.pag .sub{color:var(--ink3);margin:4px 0 18px}
.card{background:#fff;border:1px solid var(--bdr);border-radius:10px;margin-bottom:14px}
.card-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--bdr)}
.card-h h4{font-size:14px;font-weight:500}
.lst td,.lst th{padding:11px 14px}
.lst tr.fila{cursor:pointer}.lst tr.fila:hover td{background:#f7f9fd}
.vacio-grande{padding:40px 20px;text-align:center;color:var(--ink3)}
.crear .card{padding:22px 24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.f label{display:block;font-size:12.5px;font-weight:500;color:var(--ink2);margin-bottom:5px}
.f label em{font-style:normal;color:var(--ink4);font-weight:400}
.f input,.f textarea,.f select{width:100%;border:1px solid var(--bdr2);border-radius:8px;padding:9px 10px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink)}
.f input:focus,.f textarea:focus,.f select:focus{outline:2px solid var(--blue-l);border-color:var(--blue)}
.f textarea{height:74px;resize:vertical}
.f .ayuda{font-size:11.5px;color:var(--ink3);margin-top:4px}
.f.falta input,.f.falta textarea,.f.falta select{border-color:var(--magenta)}
.full{grid-column:1/-1}
.seg{display:flex;border:1px solid var(--bdr2);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:9px;font-size:13px;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--bdr2)}
.seg button.on{background:var(--navy);color:#fff}
.nom{margin-top:6px;font-size:12px;color:var(--ink3)}
.pie{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--bdr)}
.aviso-t{font-size:12px;color:var(--ink3)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--ink3);background:#f4f6fa;padding:2px 6px;border-radius:4px}
.progreso{padding:36px 24px;text-align:center}
.progreso .rueda{width:34px;height:34px;border-radius:50%;border:3px solid var(--blue-l);border-top-color:var(--magenta);margin:0 auto 14px;animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.pasos{list-style:none;display:inline-block;text-align:left;margin-top:10px;color:var(--ink3);font-size:13px}
.pasos li{padding:3px 0}.pasos li.hecho{color:var(--ok)}.pasos li.ahora{color:var(--ink);font-weight:500}

/* [2] TRABAJAR — 3 columnas */
.lay{display:grid;grid-template-columns:260px minmax(0,1fr) 390px;gap:14px;padding:14px 16px;height:calc(100vh - 56px)}
.col{background:#fff;border:1px solid var(--bdr);border-radius:10px;overflow:auto;min-height:0}
.col h3{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:14px 16px 6px}
.arbol{list-style:none;padding:0 8px 12px}
.arbol li{padding:6px 8px;border-radius:6px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);cursor:pointer}
.arbol li:hover{background:#f5f7fb}
.arbol li .n{margin-left:auto;font-size:11px;color:var(--ink4)}
.arbol li.cmp{font-weight:500;color:var(--ink);word-break:break-all}
.arbol li.l2{padding-left:22px}.arbol li.l3{padding-left:38px;font-size:12.5px}
.arbol li.sel{background:var(--blue-l);color:var(--blue);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:#d3d7e0}
.d-err{background:var(--magenta)}.d-av{background:#e0a100}.d-ok{background:var(--ok)}
.sepa{height:1px;background:var(--bdr);margin:8px 16px}
.ficha-ent{margin:4px 16px 16px;padding:12px;border:1px solid var(--bdr);border-radius:8px;font-size:12.5px;color:var(--ink2)}
.ficha-ent b{font-weight:500;color:var(--ink)}
.cen{padding:18px 22px}
.cab{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.cab h2{font-size:20px;font-weight:500;word-break:break-all}
.int{font-size:13px;color:var(--ink3);margin-bottom:14px}
.barreras{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.bar{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--bdr)}
.bar.ok{background:var(--ok-l);border-color:#bfe6cb;color:var(--ok)}
.bar.no{background:var(--magenta-l);border-color:#ecc3e6;color:var(--magenta)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;font-size:11.5px;color:var(--ink3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--bdr);background:#fafbfd}
td{padding:7px 10px;border-bottom:1px solid #f0f2f6;vertical-align:middle}
tr.pick td{background:#f3f8fe}
tr:last-child td{border-bottom:0}
tr.flash td{animation:flash 1.6s}
@keyframes flash{0%,40%{background:#fff4c2}100%{background:transparent}}
.cnt{font-size:11.5px;color:var(--ink4);text-align:right;white-space:nowrap}
.cnt.mal{color:var(--magenta);font-weight:500}
.rol{font-size:11px;padding:2px 7px;border-radius:10px;white-space:nowrap;border:0;cursor:pointer}
.r-{background:#f1f2f6;color:var(--ink4)}
.r-keyword{background:#eceff7;color:var(--ink2)}.r-tramite{background:var(--blue-l);color:var(--blue)}
.r-precio{background:#fff7cc;color:#7a6400}.r-respaldo{background:var(--teal-l);color:#138585}.r-cta{background:var(--navy-l);color:var(--navy)}
.fij{font-size:11px;color:var(--ink3);white-space:nowrap}
.cb{width:15px;height:15px;accent-color:var(--blue);cursor:pointer}
.ed-txt{outline:0;border-radius:4px;padding:2px 4px;margin:-2px -4px;display:inline-block;min-width:30px}
.ed-txt:hover{background:#f4f6fa}.ed-txt:focus{background:#fffbe6;box-shadow:0 0 0 1px #f0d77a}
.kw{display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0;padding:4px 9px;border:1px solid var(--bdr);border-radius:14px;font-size:12.5px;background:#fff}
.kw.pick{border-color:var(--blue);background:var(--blue-l)}
.kw i{font-style:normal;font-size:10.5px;padding:1px 5px;border-radius:4px;cursor:pointer}
.kw i.ex{background:var(--blue-l);color:var(--blue)}.kw i.fr{background:var(--teal-l);color:#138585}.kw i.am{background:var(--magenta-l);color:var(--magenta)}
.kw .x{border:0;background:none;color:var(--ink4);font-size:14px;line-height:1;padding:0 0 0 2px}
.kw .x:hover{color:var(--magenta)}
.serp{padding:14px;font-family:Arial,sans-serif;border-bottom:1px solid var(--bdr)}
.serp small{font-size:12px;color:#202124}
.serp .t{color:#1a0dab;font-size:18px;margin:2px 0}
.serp .d{color:#4d5156;font-size:13px}
.tabs{display:flex;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:#fff;z-index:1}
.tabs button{flex:1;border:0;background:none;padding:12px 6px;font-size:13px;color:var(--ink3);border-bottom:2px solid transparent}
.tabs button.on{color:var(--navy);border-bottom-color:var(--navy);font-weight:500}
.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--magenta);color:#fff;font-size:11px;margin-left:4px}
.pane{display:none;padding:14px 16px;flex:1}.pane.on{display:block}
.hz{border:1px solid var(--bdr);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.hz .top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.hz .cod{font-size:11px;font-weight:500;padding:1px 6px;border-radius:4px}
.cod.err{background:var(--magenta-l);color:var(--magenta)}.cod.av{background:var(--warn-l);color:var(--warn)}.cod.su{background:#eef0f4;color:var(--ink3)}
.hz .donde{font-size:11.5px;color:var(--ink3);margin-top:3px}
.hz .acc{display:flex;gap:12px;margin-top:4px}
.grp-t{font-size:12px;font-weight:500;color:var(--ink3);margin:12px 0 6px}
.ctx{background:var(--blue-l);border:1px solid #cfe0f6;border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--blue);margin-bottom:12px;display:flex;gap:8px;align-items:center}
.ctx b{font-weight:500}
.msg{margin-bottom:12px;font-size:13px}
.msg.yo{background:var(--navy-l);border-radius:10px 10px 2px 10px;padding:9px 12px;margin-left:36px;white-space:pre-wrap}
.msg.ia{display:flex;gap:9px}
.av-ia{width:26px;height:26px;border-radius:50%;background:var(--navy);flex:none;position:relative}
.av-ia:after{content:"";position:absolute;inset:8px;border-radius:50%;background:#f28c28}
.burbuja{background:#f6f7fa;border-radius:10px 10px 10px 2px;padding:10px 12px;flex:1;min-width:0}
.burbuja.pensando{color:var(--ink3)}
.cambio{border:1px solid var(--bdr);background:#fff;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12.5px}
.cambio .antes{color:var(--ink4);text-decoration:line-through;word-break:break-word}
.cambio .desp{color:var(--ink);word-break:break-word}
.cambio .meta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:11.5px;color:var(--ink3)}
.cambio .meta .sp{flex:1}
.cambio.off{opacity:.5}
.nota-ia{margin-top:8px;font-size:12px;color:var(--ink3)}
.nota-ia.mal{color:var(--magenta)}
.acciones{display:flex;gap:8px;margin-top:10px}
.caja{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--bdr);padding:10px 16px}
.modo{display:flex;gap:6px;margin-bottom:8px}
.modo button{border:1px solid var(--bdr2);background:#fff;border-radius:14px;padding:4px 11px;font-size:12px;color:var(--ink2)}
.modo button.on{border-color:var(--magenta);color:var(--magenta);background:var(--magenta-l)}
.caja textarea{width:100%;border:1px solid var(--bdr2);border-radius:8px;padding:9px 10px;font:inherit;font-size:13px;resize:none;height:62px}
.caja .fila{display:flex;align-items:center;margin-top:8px;gap:8px;font-size:11.5px;color:var(--ink4)}
.ev{font-size:12.5px;margin-bottom:12px}
.ev h5{font-size:12px;font-weight:500;margin-bottom:4px}
.ev ul{padding-left:16px;color:var(--ink2)}
.ev .vacio{color:var(--magenta);list-style:none;margin-left:-16px}
.conf td:first-child{color:var(--ink3);width:38%}
/* [3] EXPORTAR */
.opc{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px}
.op{border:1px solid var(--bdr2);border-radius:10px;padding:16px;cursor:pointer;background:#fff;text-align:left}
.op.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.op[disabled]{opacity:.5;cursor:default}
.op h4{font-size:15px;font-weight:500;margin-bottom:4px}
.op p{font-size:12.5px;color:var(--ink3)}
.op .num{font-size:24px;font-weight:500;margin-top:10px}
.lista{padding:0 18px 18px}
.lista li{list-style:none;display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid #f0f2f6;font-size:13px}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:500;white-space:nowrap}
.t-n{background:var(--ok-l);color:var(--ok)}.t-m{background:var(--blue-l);color:var(--blue)}.t-r{background:var(--warn-l);color:var(--warn)}.t-e{background:var(--magenta-l);color:var(--magenta)}
.man{margin:0 18px 18px;padding:10px 12px;border-radius:8px;background:var(--warn-l);font-size:12.5px;color:#6b4200}
/* Modal, toast */
.velo{position:fixed;inset:0;background:rgba(18,23,61,.35);display:flex;align-items:center;justify-content:center;z-index:20}
.modal{background:#fff;border-radius:12px;width:min(640px,92vw);max-height:80vh;overflow:auto}
.modal .card-h{position:sticky;top:0;background:#fff}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;display:none;z-index:30;max-width:90vw}
@media (max-width:1100px){.lay{grid-template-columns:220px minmax(0,1fr);height:auto}.lay>aside:last-child{grid-column:1/-1;min-height:520px}}
@media (max-width:760px){.grid2{grid-template-columns:1fr}.lay{grid-template-columns:1fr}.opc{grid-template-columns:1fr}.estados,.ver{display:none}}
</style>
</head>
<body>
<header class="ed" id="cab">
  <a class="marca-app" href="/home" title="Inicio · My Ads"><span class="logo"></span>My Ads</a>
  <div class="crumb" id="crumb"><a href="/campanas">Campañas</a></div>
  <span class="chip">SEARCH</span>
  <span class="sp"></span>
  <div id="cab-der" style="display:flex;align-items:center;gap:10px"></div>
</header>
<div id="app"></div>
<div id="toast"></div>

<script src="/nucleo/modelo.js"></script>
<script src="/nucleo/lecciones.js"></script>
<script src="/nucleo/reglas.js"></script>
<script src="/nucleo/ads-editor.js"></script>
<script src="/nucleo/versiones.js"></script>
<script src="/nucleo/operaciones.js"></script>
<script>
"use strict";
const M = window.MP_Modelo, R = window.MP_Reglas, AE = window.MP_AdsEditor, V = window.MP_Versiones, OPS = window.MP_Operaciones;

/* ═════ [A] UTILIDADES ═════ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clp = n => (n == null || n === "") ? "—" : "$" + Number(n).toLocaleString("es-CL");
const plural = (n, uno, varios) => n + " " + (n === 1 ? uno : varios);
const hoyCL = () => { try { return new Intl.DateTimeFormat("en-CA", { timeZone: "America/Santiago" }).format(new Date()); } catch { return new Date().toISOString().slice(0, 10); } };
const hora = iso => { try { return new Date(iso).toLocaleString("es-CL", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }); } catch { return ""; } };
let _tt = null;
function toast(t, ms) { const e = $("#toast"); e.textContent = t; e.style.display = "block"; clearTimeout(_tt); _tt = setTimeout(() => e.style.display = "none", ms || 3200); }
async function api(url, body) {
  const r = await fetch(url, body ? { method: "POST", credentials: "include", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : { credentials: "include" });
  if (r.status === 401) { location.replace("/login"); throw new Error("Sin sesión"); }
  let d = {}; try { d = await r.json(); } catch { d = { ok: false, error: "Respuesta no válida del servidor (" + r.status + ")." }; }
  d._status = r.status; return d;
}
function nav(url) { history.pushState({}, "", url); ruta(); }
window.addEventListener("popstate", () => ruta());

/* ═════ [B] ESTADO ═════ */
const S = { user: null, marcas: [], ini: null, meta: null, sel: { tipo: "config", id: null }, selIds: new Set(),
  tab: "ia", modo: "corregir", chat: [], vista: "trabajo", expTipo: "completa", publicada: null, guardando: false, sucio: false };
const ROLES = ["keyword", "tramite", "precio", "respaldo", "cta"];
const ROL_TXT = { keyword: "keyword", tramite: "trámite", precio: "precio", respaldo: "respaldo", cta: "compra", "": "sin papel" };
const marcaDe = ini => { const o = (ini && ini.objetivo) || {}; return S.marcas.find(m => m.id === o.marcaId) || S.marcas.find(m => (m.nombre || m.empresa) === o.marca) || null; };
const nombreMarca = ini => { const m = marcaDe(ini); return m ? (m.nombre || m.empresa) : ((ini && ini.objetivo && ini.objetivo.marca) || ""); };
const validar = () => R.validar(S.ini, { hoy: hoyCL(), marca: nombreMarca(S.ini) });

/* ═════ [C] ARRANQUE Y RUTAS ═════ */
(async function arranque() {
  const w = await api("/api/whoami");
  if (!w.ok) return;
  S.user = w;
  const p = w.permisos || [];
  if (!(p.includes("*") || p.includes("ads"))) { $("#app").innerHTML = `<div class="pag"><div class="card vacio-grande">Tu usuario no tiene acceso a Google Search. <a href="/home">Volver al inicio</a></div></div>`; return; }
  try { const ws = await api("/api/proyectos"); S.marcas = ((ws.proyecto && ws.proyecto.marcas) || []).filter(m => m && (m.nombre || m.empresa)); } catch {}
  ruta();
})();
function ruta() {
  const p = location.pathname.replace(/\/+$/, "");
  $("#cab-der").innerHTML = "";
  if (p === "/campanas/nueva") return pantallaCrear();
  const m = p.match(/^\/campanas\/(ini_[\w-]+)$/);

/* Niveles por id (con herencia a los padres) para los puntos del árbol. */
function nivelesPorId(v) {
  const padre = {};
  for (const c of S.ini.campanas) {
    const hijo = (x, p) => { if (x && x.id) padre[x.id] = p; };
    ["negativas", "sitelinks", "destacados", "fragmentos", "ubicaciones", "edadesExcluidas"].forEach(k => (c[k] || []).forEach(x => hijo(x, c.id + "#" + k)));
    ["negativas", "sitelinks", "destacados", "fragmentos"].forEach(k => padre[c.id + "#" + k] = c.id);
    for (const g of c.grupos || []) {
      hijo(g, c.id);
      (g.keywords || []).forEach(x => hijo(x, g.id)); (g.negativas || []).forEach(x => hijo(x, g.id));
      for (const a of g.anuncios || []) { hijo(a, g.id); (a.titulos || []).forEach(x => hijo(x, a.id)); (a.descripciones || []).forEach(x => hijo(x, a.id)); }
    }
  }
  const peso = { error: 2, aviso: 1 }, out = {};
  for (const h of v.hallazgos) { const p = peso[h.nivel]; if (!p) continue; let id = h.id, n = 0; while (id && n++ < 8) { out[id] = Math.max(out[id] || 0, p); id = padre[id]; } }
  return out;
}

  if (!r.ok) return toast(r.error || "No se pudo leer el historial.");
  const velo = document.createElement("div"); velo.className = "velo"; velo.onclick = e => { if (e.target === velo) velo.remove(); };
  velo.innerHTML = `<div class="modal"><div class="card-h"><h4>Historial · ${esc(S.ini.nombre || "")}</h4><span class="sp"></span><button class="btn sm" onclick="this.closest('.velo').remove()">Cerrar</button></div>
    <table><tr><th>Versión</th><th>Cuándo</th><th>Quién</th><th>Nota</th><th></th></tr>${(r.versiones || []).map(v => `<tr><td>v${v.version}${v.version === S.meta.publicada_version ? ' <span class="tag t-n">publicada</span>' : v.version === S.meta.exportada_version ? ' <span class="tag t-m">exportada</span>' : ""}</td><td class="fij">${esc(hora(v.creado_en))}</td><td class="fij">${esc(v.autor || "")}</td><td style="font-size:12.5px">${esc(v.nota || "")}</td><td>${v.version !== S.meta.version ? `<button class="btn link" onclick="restaurar(${v.version})">Volver a esta</button>` : '<span class="fij">actual</span>'}</td></tr>`).join("")}</table></div>`;
  document.body.appendChild(velo);
}
async function restaurar(n) {
  if (!confirm("¿Volver a la versión " + n + "? Se guarda como una versión nueva: no se pierde nada.")) return;
  const r = await api("/api/iniciativas?id=" + encodeURIComponent(S.ini.id) + "&version=" + n);
  if (!r.ok) return toast(r.error || "No se pudo leer esa versión.");
  S.ini = r.iniciativa; document.querySelector(".velo") && document.querySelector(".velo").remove();
  guardarLuego("Restaurada desde v" + n); pintar();
}

/* ═════ [G] PANTALLA 3 · EXPORTAR ═════ */
function pintarExportar() {
  const ini = S.ini, archivo = AE.nombreArchivo(ini, hoyCL());
  const filas = csv => Math.max(0, csv.trim().split("\r\n").length - 1);
  const completo = AE.exportar(ini);
  const hayPub = !!S.publicada && S.meta.publicada_version !== S.meta.version;
  let cam = null, dif = [];
  if (hayPub) { cam = V.cambiosParaEditor(S.publicada, ini); dif = V.diferencias(S.publicada, ini); }
  if (!hayPub) S.expTipo = "completa";
  const csvCambios = cam ? AE.exportar(cam.iniciativa) : "";
  const TAG = { nuevo: ["t-n", "Nuevo"], modificado: ["t-m", "Modifica"], reemplazado: ["t-r", "Reemplaza"], eliminado: ["t-e", "Elimina"] };
  const txt = x => x ? (x.texto || x.nombre || x.edad || "") : "";
  // Un anuncio adaptable no se edita en Ads Editor: se reemplaza. Se dice QUÉ textos cambian.
  const detalle = d => {
    if (d.entidad !== "anuncio" || !d.antes || !d.ahora) return d.cambio === "reemplazado" || d.cambio === "modificado" ? "«" + esc(txt(d.antes)) + "» → «" + esc(txt(d.ahora)) + "»" : "«" + esc(txt(d.ahora || d.antes)) + "»";
    const ts = a => (a.titulos || []).concat(a.descripciones || []).map(x => x.texto);
    const A = ts(d.antes), B = ts(d.ahora), sale = A.filter(t => !B.includes(t)), entra = B.filter(t => !A.includes(t));
    return "«" + esc(d.ahora.nombre) + "»: " + (sale.length || entra.length ? sale.map(t => "«" + esc(t) + "»").join(", ") + " → " + entra.map(t => "«" + esc(t) + "»").join(", ") : "cambia su configuración") + (d.cambio === "reemplazado" ? ' <span class="fij">(Ads Editor lo reemplaza: el anterior queda eliminado)</span>' : "");
  };
  const v = validar();
  $("#app").innerHTML = `<div class="pag" style="max-width:920px"><div class="card">
    <div class="card-h"><h4>Descargar para Google Ads Editor</h4><span class="sp"></span><span class="mono">${esc(archivo)}</span></div>
    ${v.errores ? `<div class="man" style="margin-top:14px">Hay ${v.errores} error(es) que Google rechazaría. Vuelve a la campaña y corrígelos antes de exportar.</div>` : ""}
    <div class="opc">
      <button class="op ${S.expTipo === "completa" ? "on" : ""}" onclick="S.expTipo='completa';pintarExportar()"><h4>Campaña completa</h4><p>Todo, para una campaña que aún no existe en tu cuenta.</p><div class="num">${filas(completo)} filas</div></button>
      <button class="op ${S.expTipo === "cambios" ? "on" : ""}" ${hayPub ? "" : "disabled"} onclick="S.expTipo='cambios';pintarExportar()"><h4>Solo cambios${hayPub ? " desde la v" + S.meta.publicada_version + " publicada" : ""}</h4><p>${hayPub ? "Lo nuevo, lo modificado y lo eliminado. Lo que no cambió no se toca." : "Disponible cuando marques una versión como publicada."}</p><div class="num">${hayPub ? filas(csvCambios) + " filas" : "—"}</div></button>
    </div>
    ${S.expTipo === "cambios" && dif.length ? `<ul class="lista">${dif.slice(0, 40).map(d => `<li><span class="tag ${TAG[d.cambio][0]}">${TAG[d.cambio][1]}</span><span>${esc(d.entidad)} ${detalle(d)}</span><span class="sp" style="flex:1"></span><span class="fij">${esc(d.donde)}</span></li>`).join("")}${dif.length > 40 ? `<li class="fij">… y ${dif.length - 40} más.</li>` : ""}</ul>` : ""}
    ${S.expTipo === "cambios" && cam && cam.manual.length ? `<div class="man">Hazlo a mano en Ads Editor: ${cam.manual.map(esc).join(" · ")}</div>` : ""}
    <div class="pie" style="padding:14px 18px;margin:0"><span class="aviso-t">Tras publicar, los nombres de campañas y grupos quedan fijos: Ads Editor los reconoce por su nombre.</span><span class="sp"></span>
      <button class="btn pri" ${v.errores ? "disabled" : ""} onclick="descargar()">Descargar ${S.expTipo === "cambios" ? filas(csvCambios) : filas(completo)} filas</button></div>
  </div></div>`;
}
async function descargar() {
  const ini = S.ini, cambios = S.expTipo === "cambios" && S.publicada;
  const csv = cambios ? AE.exportar(V.cambiosParaEditor(S.publicada, ini).iniciativa) : AE.exportar(ini);
  const nombre = AE.nombreArchivo(ini, hoyCL()).replace(/\.csv$/, cambios ? "-cambios.csv" : ".csv");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  if (S.meta.estado === "aprobada") await cambiarEstado("exportada");
  toast("Descargado: " + nombre);
}
</script>
</body>
</html>
