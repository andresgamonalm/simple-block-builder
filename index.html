<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Mi Publicidad · Entrar</title>
<link rel="icon" href="/brand/mi-publicidad.svg?v=3" type="image/svg+xml">
<link rel="alternate icon" href="/brand/icono_mi_publicidad.ico?v=3" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   PANTALLA DE ACCESO
   Diagramación adaptada del paquete de referencia del usuario: UNA tarjeta
   centrada, todo en una columna, con el logotipo ARRIBA del rótulo (un
   lockup no se acuesta junto a un texto: se ve torcido) y un ritmo parejo
   de 22px entre logo, rótulo y titular.
   Lo que NO se copió: la paleta de esa referencia (es de otra marca) y su
   arquitectura de Worker + lista de correos — aquí el acceso es usuario +
   contraseña contra usuarios.js, y eso no cambia.
   Identidad propia: Roboto 300-600 (nunca 700), navy #040764 primario,
   azul #1C73CB acento, radio 10px del chrome.
   ═══════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:"Roboto",Arial,Helvetica,sans-serif;background:#040764;color:#12173d;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
body{display:grid;place-items:center;min-height:100vh;padding:24px;}

/* ── Fondo: la fotografía a sangre con velo navy. Si la foto no carga, queda
      el navy plano — nunca una imagen rota. ── */
.fondo{position:fixed;inset:0;z-index:0;background:#040764;overflow:hidden;}
.fondo img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
.fondo::after{content:"";position:absolute;inset:0;background:rgba(4,7,100,.70);}

/* ── La tarjeta: 440px, la medida de la referencia. Una sola columna. ── */
.caja{position:relative;z-index:1;width:min(100%,440px);background:#fff;border-radius:10px;
  padding:40px 36px;box-shadow:0 18px 48px rgba(4,7,100,.28);display:none;}
.caja.lista{display:block;}

/* Logo arriba, rótulo debajo, y 22px parejos hasta el titular. */
.marca{display:flex;flex-direction:column;align-items:flex-start;gap:22px;margin-bottom:22px;}
.marca svg{display:block;width:44px;height:44px;}
.marca b{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#040764;}

/* text-wrap:balance reparte las líneas: sin él el titular dejaba "usuario"
   solo en la segunda línea. */
h1{margin:0;font-size:25px;line-height:1.2;font-weight:600;letter-spacing:-.02em;color:#12173d;text-wrap:balance;}
p.sub{margin:10px 0 26px;font-size:15px;line-height:1.35;color:#6b7180;font-weight:400;}

label{display:block;font-size:13px;font-weight:600;margin:0 0 7px;color:#12173d;}
.campo{margin-bottom:16px;}
.campo-pass{position:relative;}
input{width:100%;height:50px;padding:0 15px;font-size:16px;border-radius:10px;
  border:1px solid #cfd6e4;background:#f7f9fc;color:#12173d;font-family:inherit;}
.campo-pass input{padding-right:52px;}
/* El anillo de foco NUNCA se quita: es navegación por teclado y accesibilidad. */
input:focus{outline:3px solid rgba(28,115,203,.35);outline-offset:1px;border-color:#1C73CB;background:#fff;}
input:disabled{opacity:.6;cursor:not-allowed;}
.ver-pass{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border:0;background:none;
  cursor:pointer;color:#8b91a4;display:flex;align-items:center;justify-content:center;border-radius:8px;}
.ver-pass:hover{color:#040764;background:#eef2f9;}
.ver-pass:focus-visible{outline:3px solid rgba(28,115,203,.35);outline-offset:1px;}

button.entrar{width:100%;height:50px;margin-top:6px;border:0;border-radius:10px;cursor:pointer;
  background:#040764;color:#fff;font-size:16px;font-weight:600;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:background .14s;}
button.entrar:hover:not(:disabled){background:#04065A;}
button.entrar:focus-visible{outline:3px solid rgba(28,115,203,.45);outline-offset:1px;}
button.entrar:disabled{opacity:.6;cursor:not-allowed;}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite;display:none;}
button.entrar.loading .spin{display:block;}
@keyframes sp{to{transform:rotate(360deg);}}

/* El aviso: barra de color a la izquierda, como en la referencia, con los
   colores de aquí (magenta = lo destructivo/atención en esta identidad). */
.aviso{margin-top:20px;padding:14px 16px;border-radius:10px;font-size:14px;line-height:1.35;display:none;}
.aviso.show{display:block;}
.aviso.err{background:#FBE9F2;border-left:4px solid #A8206E;color:#7A1650;}
.aviso.info{background:#E8F1FC;border-left:4px solid #1C73CB;color:#0E4C8A;}
.aviso a{color:inherit;font-weight:600;}

.pie{margin-top:26px;font-size:12px;line-height:1.5;color:#8b91a4;}
/* El enlace no se parte en dos líneas. */
.pie a{color:#6b7180;white-space:nowrap;}

.splash{position:fixed;inset:0;z-index:5;background:#040764;display:grid;place-items:center;}
.splash .spin{display:block;width:30px;height:30px;border:2.5px solid rgba(255,255,255,.2);
  border-top-color:rgba(255,255,255,.85);}
.splash.hidden{display:none;}

@media(max-width:520px){
  body{padding:14px;}
  .caja{padding:30px 22px;}
  h1{font-size:22px;}
}
</style>
</head>
<body>

<div class="fondo">
  <img src="/assets/login/foto_login_mi_publicidad.jpg" alt=""
       onerror="this.remove()">
</div>

<div class="splash" id="splash"><div class="spin"></div></div>

<main class="caja" id="caja">
  <div class="marca">
    <svg viewBox="0 0 40 40" role="img" aria-label="Mi Publicidad">
      <rect width="40" height="40" rx="10" fill="#040764"/>
      <rect x="9" y="10" width="22" height="5" rx="2.5" fill="#FCE865"/>
      <rect x="9" y="19" width="9.5" height="11" rx="2.4" fill="#1C73CB"/>
      <rect x="21.5" y="19" width="9.5" height="11" rx="2.4" fill="#20B6B6"/>
    </svg>
    <b>Mi Publicidad</b>
  </div>

  <h1>Bienvenido, entra con tu usuario</h1>
  <p class="sub">Tu estudio para armar campañas de Google Display, Facebook Ads y Google Search con la identidad de cada marca.</p>

  <form id="form" autocomplete="on">
    <div class="campo">
      <label for="usuario">Usuario o correo</label>
      <input id="usuario" name="username" type="text" required autocomplete="username"
             autofocus autocapitalize="none" spellcheck="false" placeholder="tu usuario o tu correo">
    </div>
    <div class="campo campo-pass">
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" required autocomplete="current-password"
             placeholder="Escribe tu contraseña">
      <button type="button" class="ver-pass" id="ver-pass" aria-label="Mostrar u ocultar la contraseña" title="Mostrar u ocultar la contraseña">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>
      </button>
    </div>
    <button type="submit" class="entrar" id="btn">
      <span class="spin"></span><span class="lbl">Entrar</span>
    </button>
  </form>

  <p class="aviso" id="aviso"></p>

  <p class="pie">Solo usuarios autorizados. El acceso queda registrado.<br>
    ¿Sin acceso o sin contraseña? <a id="pedir" href="#">Pídesela al administrador</a>.</p>
</main>

<script>
(async () => {
  /* A quién se le pide el acceso. Cámbialo aquí si prefieres otra dirección
     o no quieres publicar ninguna (deja la cadena vacía y el enlace
     desaparece, quedando solo el texto). */
  const CORREO_CONTACTO = "hola@andresgamonal.com";
  const ASUNTO_CONTACTO = "Acceso a Mi Publicidad";

  const splash = document.getElementById("splash");
  const caja   = document.getElementById("caja");
  const aviso  = document.getElementById("aviso");

  const mostrarAviso = (texto, clase, conCorreo) => {
    /* El texto va como TEXTO, nunca como HTML: así nadie inyecta nada por la
       barra de direcciones. El enlace se agrega APARTE, fuera de lo escapado
       — el detalle que la referencia deja anotado y que es fácil perder. */
    aviso.textContent = texto;
    if (conCorreo && CORREO_CONTACTO) {
      aviso.appendChild(document.createTextNode(" "));
      const a = document.createElement("a");
      a.href = "mailto:" + CORREO_CONTACTO + "?subject=" + encodeURIComponent(ASUNTO_CONTACTO);
      a.textContent = CORREO_CONTACTO;
      aviso.appendChild(a);
    }
    aviso.className = "aviso " + clase + " show";
  };

  // El enlace del pie pide el acceso con el asunto ya escrito.
  const pedir = document.getElementById("pedir");
  if (CORREO_CONTACTO) {
    pedir.href = "mailto:" + CORREO_CONTACTO + "?subject=" + encodeURIComponent(ASUNTO_CONTACTO);
  } else {
    pedir.replaceWith(document.createTextNode("pídesela al administrador"));
  }

  // Si ya hay sesión, no se muestra el formulario: se entra directo.
  try {
    const r = await fetch("/api/whoami", { credentials: "include" });
    if (r.ok) { location.replace("/home"); return; }
  } catch (e) {}

  splash.classList.add("hidden");
  caja.classList.add("lista");
  document.getElementById("usuario").focus();

  // Mensajes al volver con error (enlaces mágicos viejos, ya desactivados).
  const params = new URLSearchParams(location.search);
  const err = params.get("login_error");
  if (err) {
    mostrarAviso(err === "desactivado"
      ? "El acceso por enlace de correo se reemplazó: ahora entra con tu usuario y contraseña."
      : "Hubo un problema al entrar. Usa tu usuario y contraseña.", "info", false);
    history.replaceState({}, "", location.pathname);
  }

  const form = document.getElementById("form");
  const userInput = document.getElementById("usuario");
  const passInput = document.getElementById("password");
  const btn = document.getElementById("btn");
  const btnLbl = btn.querySelector(".lbl");
  const setBusy = (b) => {
    btn.classList.toggle("loading", b); btn.disabled = b;
    userInput.disabled = b; passInput.disabled = b;
    btnLbl.textContent = b ? "Entrando…" : "Entrar";
  };

  document.getElementById("ver-pass").addEventListener("click", () => {
    passInput.type = passInput.type === "password" ? "text" : "password";
    passInput.focus();
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const usuario = userInput.value.trim();
    const password = passInput.value;
    if (!usuario || !password) return;
    setBusy(true);
    aviso.classList.remove("show");
    try {
      const r = await fetch("/api/auth/login", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ usuario, password })
      });
      const data = await r.json().catch(() => ({}));
      if (r.ok && data.ok) { location.replace("/home"); return; }
      /* UN SOLO MENSAJE, exista o no el usuario. La referencia distingue
         "no estás en la lista" de "se te acabaron los ingresos" porque ahí
         no hay contraseña; aquí sí la hay, y separar los casos diría cuáles
         usuarios existen. El correo de contacto cubre igual al que no tiene
         acceso, sin regalar esa información. */
      mostrarAviso(data.error || "Usuario o contraseña incorrectos.", "err", true);
      setBusy(false);
      passInput.value = ""; passInput.focus();
    } catch (e) {
      mostrarAviso("No se pudo conectar. Revisa tu conexión y vuelve a intentar.", "err", false);
      setBusy(false);
    }
  });
})();
</script>

</body>
</html>
